name: elix_mpnn

defaults:
  - _self_

task: ${model.task}

mpnn:
  hidden_dim: 128
  k_neighbors: 32
  num_protein_encoder_layers: 3
  num_mixing_encoder_layers: 3
  use_mixing_encoder: true
  mixing_encoder_input_mode: "node_add"
  update_final_protein_encoder_edge: false
  dropout_p: 0.1
  ligand_conditioning: true

  # ligand conditioning options
  use_context_skip_connection: false
  context_conditioner:
    dropout_p: ${denoiser.mpnn.dropout_p}
    num_context_encoder_layers: 2
    num_context_to_protein_layers: 2
    update_context_edges: false
    update_protein_context_edges: false
    update_final_context_edge: true
    update_final_protein_context_edge: false

  token_features:
    num_rbf: 16
    min_rbf_mean: 2.0
    max_rbf_mean: 22.0
    protein_graph_rbf_type: "ncacocb" # "ca", "ncaco", "ncacocb"
    k_neighbors: ${denoiser.mpnn.k_neighbors}
    num_positional_embeddings: 16
    hidden_dim: ${denoiser.mpnn.hidden_dim}
    protein_ligand_interaction_rbf_type: "ncacocb" # "cb", "ncacocb"
    add_angle_features: true
    use_multichain_encoding: true
    ligand_conditioning: ${denoiser.mpnn.ligand_conditioning}
    use_ligand_context: true
    ligand_atom_context_num: 25
    # Ligand atom/context features; omitted optional flags stay disabled in saved legacy configs.
    use_ligand_aromatic_atom_feature: false
    use_ligand_aromatic_edge_feature: false
    use_ligand_chirality_tag: false
    use_ligand_f_block_features: false
    use_ligand_asinh_formal_charge: true
    use_ligand_cached_rdkit_chirality: false
    use_ligand_bond_order: false
    use_token_bonds: false
    add_hydrogenbond_feature: false

    masked_distance_fill: 1000.0

  potts:
    k_neighbors_potts: 32
    max_dist_potts: null
    use_potts: true
    norm_potts_inputs: false  # LayerNorm h_V/h_E before the Potts head
    parameterization: "factor"
    num_factors: null
    num_heads: 1
    reduce: "mean" # mean or sqrt; used by multi_head_factor
    symmetric_J: true
    multi_head:
      dim_multi_head: 128
      reduce: "mean" # "mean", "sqrt"
      num_heads: 4

  expansion_mode: null # null, node_concat, node_concat_context_skip, multi_head_factor, node_concat_multi_head
