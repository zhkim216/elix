# Local two-stage denovoval ensemble-conditioning smoke.
# Runs pocket -> scaffold design on two denovoval_sm_metal CIFs, then AF3
# self-consistency with the local AF3 paths inherited from debug_run_elix.
defaults:
  - debug_run_elix_two_stage
  - _self_

debug: false
num_debug_samples: 2
exp_name: proto_exp4_cfg8_pocket_noise0p1_proto_exp4_cfg9_scaffold_noise0p5_denovoval_sm_metal_twostage_ps_af3_smoke
base_out_dir: /home/yjhk/model-dev/debug/debug_eval_ligand_seq_des

# Top-level model = stage2 scaffold; keep this aligned with two_stage.scaffold.
model_cfg:
  denoiser_train_dir: /home/yjhk/model-dev/out_dir/ligand_seq_des/proto_exp4_cfg9
  ckpt_cfg:
    start_step: 82500
    end_step: 82500
    eval_every_n_ckpts: 1
    eval_last_ckpt: false
    use_ema: false

two_stage:
  enabled: true
  direction: ps
  pocket_distance: 10.0
  pocket_annotation_method: calpha
  use_calpha_for_pocket_annotation: true
  pocket:
    label: proto_exp4_cfg8_pocket_ec_p0p1
    model_cfg:
      model_name: elix_mpnn
      denoiser_train_dir: /home/yjhk/model-dev/out_dir/ligand_seq_des/proto_exp4_cfg8
      ckpt_cfg:
        start_step: 22500
        end_step: 22500
        eval_every_n_ckpts: 1
        eval_last_ckpt: false
        use_ema: false
    sampling_cfg:
      base_cfg_path: ${sampling_cfg.base_cfg_path}
      overrides:
        batch_size: 1
        num_seqs_per_pdb: 1
        use_potts_sampling: true
        potts_sampling_cfg:
          potts_sweeps: 50
          lcp_expand_edge_idx_fix: true
          rejection_step: false
          potts_only_cond: false
          ensemble_conditioning:
            enabled: true
            num_ensembles: 16
            reduce: "mean"
            noise_seed: null
            save_noisy_inputs_dir: null
            noise_std:
              protein: 0.1
              metal: 0.0
              nonpolymer: 0.0
      guidance: ${sampling_cfg.guidance}
  scaffold:
    label: proto_exp4_cfg9_scaffold_ec_p0p5
    model_cfg:
      model_name: elix_mpnn
      denoiser_train_dir: /home/yjhk/model-dev/out_dir/ligand_seq_des/proto_exp4_cfg9
      ckpt_cfg:
        start_step: 82500
        end_step: 82500
        eval_every_n_ckpts: 1
        eval_last_ckpt: false
        use_ema: false
    sampling_cfg:
      base_cfg_path: ${sampling_cfg.base_cfg_path}
      overrides:
        batch_size: 1
        num_seqs_per_pdb: 1
        use_potts_sampling: true
        potts_sampling_cfg:
          potts_sweeps: 50
          lcp_expand_edge_idx_fix: true
          rejection_step: false
          potts_only_cond: true
          ensemble_conditioning:
            enabled: true
            num_ensembles: 16
            reduce: "mean"
            noise_seed: null
            save_noisy_inputs_dir: null
            noise_std:
              protein: 0.5
              metal: 0.0
              nonpolymer: 0.0
      guidance: ${sampling_cfg.guidance}

sampling_inputs_csv: null
pos_constraint_csv: null

input_sample_is_designed: true
pdb_cfg:
  pdb_dir: /home/yjhk/model-dev/datasets/val_cifs/denovoval_cifs/denovoval_sm_metal/cifs
  pdb_name_list: /home/yjhk/model-dev/allatom-design/allatom_design/configs_local/eval/sampling/denovoval_sm_metal_2sample.txt
  pdb_name_ext: ".cif"
  n_subsample: null
  recursive: false
  split_by_subfolder: false
  sample_indices: null
  sample_lengths: null
  array_id: null
  num_arrays: null

pocket_cfg:
  pocket_distances_for_seq_recovery: [4.0, 6.0, 8.0, 10.0]
  n_min_ligand_atoms_for_seq_recovery: 1
  pocket_distance_for_docking_metrics: 10.0
  pocket_distance_bins: [[0.0, 4.0], [4.0, 6.0], [6.0, 8.0], [8.0, 10.0]]

struct_pred_cfg:
  evaluate_self_consistency: true
  evaluate_docking_consistency: false
  calculate_metrics_only: false
  af3:
    inference_config:
      ss:
        num_recycles: 1
        num_diffusion_samples: 1

hydra:
  run:
    dir: /home/yjhk/model-dev/debug/hydra_outputs/debug_run_elix_two_stage_denovoval_ensemble
