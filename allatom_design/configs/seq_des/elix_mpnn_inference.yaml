defaults:
  - _self_

batch_size: 16
num_seqs_per_pdb: 1
verbose: true
num_workers: 8  # number of workers for data loading

# Sequence design options
use_potts_sampling: true

skip_sampling: false  # if true, skip sampling and just return potts parameters
save_potts_params: false

omit_aas: null  # exclude certain aatypes globally, e.g. ["C", "G"]. "X" is always excluded.

potts_sampling_cfg:
  allow_unk_redesign: false
  regularization: "LCP"
  potts_sweeps: 500
  potts_proposal: "dlmc"
  potts_temperature: 0.01  # this is the default in Chroma
  rejection_step: false
  potts_only_cond: false  # only condition on sequence in the potts model

  # Sampling-only pairwise coupling transform. Statistics are computed over
  # every edge's full Q x Q state matrix with no variance floor:
  #   F_ij = (J_ij - mu_ij) / sigma_ij
  #   J'_ij = alpha * J_ij + beta * F_ij
  frustration:
    enabled: false
    alpha: 1.0
    beta: 0.0

  # add gaussian noise to inputs
  noise_std: 0.0

  # Ensemble conditioning computes Potts parameters on multiple independently
  # noised copies of each input and aggregates h/J before sampling. The sampled
  # CIF coordinates still come from the original unnoised input batch.
  ensemble_conditioning:
    enabled: false
    total_members: 1
    weights:
      scheme: "mean"  # mean, sqrt, or weighted_mean
      ref_weight: 0.7
      decoy_total_weight: 0.3
    noise_seed: null
    save_noisy_inputs_dir: null
    protein:
      mode: "gaussian_noise"
      noise_std: 0.0
    metal:
      mode: "gaussian_noise"
      noise_std: 0.0
    small_molecule:
      mode: "gaussian_noise"  # gaussian_noise, ligand_conformer, pharm_retrieval, or none
      noise_std: 0.0
      num_conformer_candidates: 50
      rmsd_cluster_cutoff: 2.0
      seed: null
      num_threads: 1
      uff_optimize: true
      clash_target_atoms: "all_protein"  # sidechain, backbone, or all_protein
      vdw_overlap_cutoff: 0.5
      exclude_clashing_decoys: false
      pharm_retrieval:
        cif_root: null
        selected_queries_tsv: null
        rank_indices: []
        query_pn_unit_iids: null
    noise_std:
      protein: 0.0
      metal: 0.0
      nonpolymer: 0.0

  # Classifier-free-style guidance: mix a ligand-conditioned ("cond") and
  # ligand-absent ("uncond") Potts proposal at each DLMC sweep. When
  # `enabled=false` this is a no-op and the sampler uses the cond branch
  # only. Guidance mixes `h`, `J` linearly (γ·cond + (1-γ)·uncond) and
  # runs the standard DLMC proposal on the mixed parameters, giving an
  # exact sampler for the Boltzmann distribution of
  #     U_mix = γ·U_cond + (1-γ)·U_uncond
  # (exploits the linearity of the Potts energy in (h, J); requires
  # edge_idx_cond == edge_idx_uncond, which holds here because both
  # branches share the same protein kNN graph).
  guidance_cfg:
    enabled: false
    mode: "cond_uncond"
    gamma_list: [0.0, 0.5, 1.0, 1.5, 2.0]   # gamma > 1 = CFG extrapolation
    uncond_mode: "protein_only"              # cond_uncond negative branch
    pocket_distance: 10.0                    # Å from any ligand atom to C-alpha for the pocket mask
