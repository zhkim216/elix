name: elix_mpnn

defaults:
  - _self_

task: ${model.task}

mpnn:
  hidden_dim: 128
  k_neighbors: 32
  num_encoder_layers: 3
  num_decoder_layers: 3
  use_mpnn_decoder: true
  decoder_input_mode: "legacy_node_add"
  # Legacy and existing checkpoints skip only the final encoder edge update.
  update_final_encoder_edge: false
  dropout_p: 0.1
  ligand_conditioning: true

  # ligand conditioning options
  use_context_skip_connection: false
  lmpnn_module:
    # ContextModule processor, aggregator, and final residual dropout.
    # Following the global value preserves legacy behavior unless explicitly overridden.
    dropout_p: ${denoiser.mpnn.dropout_p}
    num_context_feature_processor_layers: 2
    num_context_feature_aggregator_layers: 2
    # Controls edge update inside ContextModule (ligand context branch).
    context_edge_update: false
    # Preserve existing context-edge-update checkpoints by default. New runs may
    # disable only the final processor edge update because its edge is not consumed.
    update_final_context_processor_edge: true
    # The final PC edge was historically terminal. Keep it off unless a
    # downstream shared-atom triangle consumes the returned PC representation.
    update_final_context_aggregator_edge: false
  shared_atom_triangle:
    hidden_dim: 128
    edge_chunk_size: 4
    mixing_encoder_layers: []

  protein_pair_triangle:
    hidden_dim: 128
    target_chunk_size: 4
    mixing_encoder_layers: []

  token_features:
    num_rbf: 16
    min_rbf_mean: 2.0
    max_rbf_mean: 22.0
    protein_graph_rbf_type: "ncacocb" # "ca", "ncaco", "ncacocb"
    k_neighbors: ${denoiser.mpnn.k_neighbors}
    num_positional_embeddings: 16
    hidden_dim: ${denoiser.mpnn.hidden_dim}
    protein_ligand_interaction_rbf_type: "ncacocb" # "cb", "ncacocb"
    add_angle_features: true
    use_multichain_encoding: true
    ligand_conditioning: ${denoiser.mpnn.ligand_conditioning}
    use_ligand_context: true
    ligand_atom_context_num: 25
    # Ligand atom/context features; omitted optional flags stay disabled in saved legacy configs.
    use_ligand_aromatic_atom_feature: false
    use_ligand_aromatic_edge_feature: false
    use_ligand_f_block_features: false
    use_ligand_asinh_formal_charge: true
    use_ligand_cached_rdkit_chirality: false
    use_ligand_bond_order: false
    use_token_bonds: false
    add_hydrogenbond_feature: false

    masked_distance_fill: 1000.0

  potts:
    k_neighbors_potts: 32
    max_dist_potts: null
    use_potts: true
    norm_potts_inputs: false  # LayerNorm h_V/h_E before the Potts head
    parameterization: "factor"
    symmetric_J: true
    multi_head:
      reduce: "mean"
      num_heads: 4
      adapter_hidden_dim: 640
      shared_edge_dim: null

  sidechain_prediction:
    enabled: false
    hidden_dim: ${denoiser.mpnn.hidden_dim}
    num_chi: 4
    num_bins: 72
    dropout_p: ${denoiser.mpnn.dropout_p}
    use_node_norm: true

  # `null` is reserved for `caliby_concat`.
  expansion_mode: "node_concat" # node_concat or edge_node_context_concat_multi_head_gate_nonlinear
