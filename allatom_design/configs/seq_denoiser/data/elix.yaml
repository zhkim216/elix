task: ${model.task}
dataset_impl: atomworks_sd
pdb_path: /scratch/users/zhkim216/datasets/atomworks_pdb_full_v9
train_metadata_path: /scratch/users/zhkim216/datasets/atomworks_pdb_full_v9/final/step2_annotate_metal_evidence/outputs/metadata_ligval_metalfixed_metal_evidence_seq_clustered_03.parquet

validation_ids_file: null
val_metadata_path: /scratch/users/zhkim216/datasets/evaluation_datasets/nativeval/metadata_for_training_nativeval.parquet

debug: ${train.debug}
debug_num_ids: 10000
save_failed_examples_to_dir: ${out_dir}/failed_examples
residue_cache_dir: /scratch/users/zhkim216/datasets/atomworks_cached_residue_data
exclude_val_cluster: true

# --- protein-cluster column selection ---
# Cluster column used for cluster-balanced sampling weights and protein_cluster_multiset.
# Choose among: q_pn_unit_cluster_{03,04,05,06,07}_id, q_pn_unit_cluster_foldseek_id.
cluster_id_col: q_pn_unit_cluster_03_id
# Cluster column used to remove train/val overlap (sequence-identity leakage). Fixed to seq cluster 0.3.
val_exclusion_cluster_id_col: q_pn_unit_cluster_03_id

query_pn_unit_iids_only: true

bml_center:
  metal:
    external_evidence_policy: ["pubmed", "medba"]
    allowed_ccd_codes: null
    min_protein_donor_atoms: 3
    min_avg_occupancy_nonpolymer: 0.5
  small_molecule:
    external_evidence_policy: ["klifs", "prd"]
    min_contacting_protein_atoms: 20
    min_contacting_protein_atom_ratio: 1.0
    min_avg_occupancy_nonpolymer: 0.5
    max_missing_atom_fraction: 0.2
    exclude_maybe_covalently_linked_small_molecules: true

bml_context:
  enabled: true
  contact_distance_cutoff: 5.0
  max_iterations: 10
  small_molecule:
    min_contacting_heavy_atoms: 20
    min_contacting_heavy_atom_ratio: 1.0
  metal:
    min_coordinating_atoms: 3
    min_avg_occupancy_nonpolymer: 0.5
  halide:
    allowed_ccd_codes: ["F"]
    min_non_carbon_contacts: 3
    min_avg_occupancy_nonpolymer: 0.5
  peptide:
    enabled: true
  nucleic_acid:
    enabled: true

train_filters:
  metadata_filter:
    - "deposition_date < '2023-01-01'"
    - "clash_severity != 'severe'"
    - "~method.str.contains('NMR')"
    - "method in ['X-RAY_DIFFRACTION', 'ELECTRON_MICROSCOPY']"
    - "num_polymer_pn_units < 50"
  protein_monomer_chain_filter:
    - "(q_pn_unit_is_protein and resolution < 3.5 and 20 <= q_pn_unit_num_resolved_residues < 2048)"
  interface_filter:
    "1":
      - "resolution < 3.5"
    "2":
      - "interface_type in ['bmm_protein', 'bmsm_protein', 'nuc_lig_protein', 'peptide_protein']"
      - "n_prot == 1"

val_filters:
  metadata_filter: []

sampling_weights:
  alphas_interface:
    alpha_protein_protein:        0.0
    alpha_protein_small_molecule: 1.0
    alpha_protein_metal:          1.0
    alpha_protein_nuc:            0.0
    alpha_protein_nuc_lig:        1.0
    alpha_protein_peptide:        1.0
  single_protein_context_weight: 1.0
  multi_protein_context_weight: 1.0
  k_percentile: 90.0
  ligand_cluster_col: null

cif_parser_args:
  add_missing_atoms: true
  remove_waters: true
  remove_ccds: []
  fix_ligands_at_symmetry_centers: true
  fix_arginines: true
  convert_mse_to_met: true
  hydrogen_policy: "remove"

interface_only_training: false

featurizer_cfg:
  is_inference: false
  occupancy_threshold_protein_backbone: 0.0
  training_structure_noise: 0.1
  undesired_res_names: []
  remove_unresolved_tokens: true
  max_tokens: 256
  max_atoms: 2304
  crop_center_cutoff_distance: 15.0
  crop_spatial_p_protein_monomer_chain: 0.25
  drop_prob_non_protein_chains: 0.0
  pocket_distance: 5.0
  pocket_n_min_ligand_atoms: 1
  residue_cache_dir: ${data.residue_cache_dir}
  max_conformers_per_residue: 50
  apply_random_augmentation: true
  translation_scale: 1.0
  asymmetric_noise: false
  protein_noise_scale: 0.1
  context_noise_scale: 0.1
  pseudo_ligand_occupancy_threshold: 0.5

samples_per_epoch: 1000
batch_size: ${train.batch_size}
num_workers: ${num_workers}
random_seed: ${train.seed}
