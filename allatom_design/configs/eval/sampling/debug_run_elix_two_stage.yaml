# Debug two-stage eval config for Sherlock.
# Reproduces the nativeval_sm_metal two-stage failure combo end-to-end:
#   stage1 pocket   = elix_exp2_cfg4 @ step 82500
#   stage2 scaffold = elix_exp1_cfg3 @ step 12500
# Base/AF3/data paths inherit Sherlock defaults from run_elix.yaml.
#
# Run on Sherlock:
#   python3 allatom_design/eval/sampling/run_elix.py \
#     --config-path allatom_design/configs/eval/sampling \
#     --config-name debug_run_elix_two_stage
defaults:
  - run_elix_two_stage
  - _self_

exp_name: elix_exp2_cfg4_pocket_elix_exp1_cfg3_scaffold_nativeval_sm_metal_twostage_ps_potts_only_cond_true_pd8.0_pseqs1_sseqs1_pocketann_calpha_debug
base_out_dir: /scratch/users/zhkim216/out_dir/eval_ligand_seq_des

seed: 0
num_workers: 8
protein_only: false
run_seq_des: true

# Top-level model = stage2 scaffold (matches the two-stage sbatch convention).
model_cfg:
  model_name: elix_mpnn
  denoiser_train_dir: /scratch/users/zhkim216/out_dir/ligand_seq_des/elix_exp1_cfg3
  ckpt_cfg:
    start_step: 12500
    end_step: 12500
    eval_every_n_ckpts: 1
    eval_last_ckpt: false
    use_ema: true

sampling_cfg:
  overrides:
    batch_size: 8
    num_seqs_per_pdb: 1
    use_potts_sampling: true
    potts_sampling_cfg:
      potts_sweeps: 500
      lcp_expand_edge_idx_fix: true
      rejection_step: false
  guidance:
    enabled: false

two_stage:
  enabled: true
  direction: ps
  pocket_distance: 8.0
  pocket_annotation_method: calpha
  use_calpha_for_pocket_annotation: true
  pocket:
    label: elix_exp2_cfg4_pocket
    model_cfg:
      model_name: elix_mpnn
      denoiser_train_dir: /scratch/users/zhkim216/out_dir/ligand_seq_des/elix_exp2_cfg4
      ckpt_cfg:
        start_step: 82500
        end_step: 82500
        eval_every_n_ckpts: 1
        eval_last_ckpt: false
        use_ema: true
    sampling_cfg:
      overrides:
        batch_size: 8
        num_seqs_per_pdb: 1
        use_potts_sampling: true
        potts_sampling_cfg:
          potts_sweeps: 500
          lcp_expand_edge_idx_fix: true
          rejection_step: false
          potts_only_cond: false
  scaffold:
    label: elix_exp1_cfg3_scaffold
    model_cfg:
      model_name: elix_mpnn
      denoiser_train_dir: /scratch/users/zhkim216/out_dir/ligand_seq_des/elix_exp1_cfg3
      ckpt_cfg:
        start_step: 12500
        end_step: 12500
        eval_every_n_ckpts: 1
        eval_last_ckpt: false
        use_ema: true
    sampling_cfg:
      overrides:
        batch_size: 8
        num_seqs_per_pdb: 1
        use_potts_sampling: true
        potts_sampling_cfg:
          potts_sweeps: 500
          lcp_expand_edge_idx_fix: true
          rejection_step: false
          potts_only_cond: true

sampling_inputs_csv: /scratch/users/zhkim216/datasets/val_cifs/nativeval_cifs/sampling_inputs_sm_metal.csv
pos_constraint_csv: null

pocket_cfg:
  pocket_distance_for_docking_metrics: 8.0
  pocket_distances_for_seq_recovery: [4.0, 6.0, 8.0, 10.0]
  pocket_distance_bins: [[0.0, 4.0], [4.0, 6.0], [6.0, 8.0], [8.0, 10.0]]
  n_min_ligand_atoms_for_seq_recovery: 1

input_sample_is_all_atom: true
input_sample_is_designed: false
load_from_cache: false

pdb_cfg:
  pdb_dir: /scratch/users/zhkim216/datasets/val_cifs/nativeval_cifs/cifs
  pdb_name_list: /scratch/users/zhkim216/datasets/val_cifs/nativeval_cifs/nativeval_sm_metal.txt
  pdb_name_ext: ".cif"
  recursive: false
  split_by_subfolder: false
  sample_indices: null
  sample_lengths: null

cif_cfg:
  save:
    include_bonds: false

struct_pred_cfg:
  evaluate_self_consistency: true
  evaluate_docking_consistency: false
  calculate_metrics_only: false
  af3:
    inference_config:
      ss:
        num_recycles: 10
        num_diffusion_samples: 5

hydra:
  run:
    dir: /scratch/users/zhkim216/hydra_outputs/debug_run_elix_two_stage/${exp_name}
