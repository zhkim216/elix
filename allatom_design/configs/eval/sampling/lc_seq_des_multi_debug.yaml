# Sherlock interactive smoke config for proto metal nativeval lc_seq_des_multi.
# Run from /home/users/zhkim216/code/elix:
#   python3 allatom_design/eval/sampling/lc_seq_des_multi.py --config-name lc_seq_des_multi_debug

defaults:
  - lc_seq_des_multi
  - _self_

wandb:
  no_wandb: true
  project: "eval_ligand_seq_des"
  wandb_id: "zhkim216"
  group: "metal_nativeval_sm_all_debug"

debug: true
num_debug_samples: 2
seed: 0
num_workers: 0
protein_only: false
run_seq_des: true

exp_name: debug_proto_allprot_external_evidence_metal_nativeval_sm_all_seq2
base_out_dir: /scratch/users/zhkim216/out_dir/debug_eval_ligand_seq_des

seq_des_cfg:
  denoiser_train_dir: /scratch/users/zhkim216/out_dir/ligand_seq_des/proto_allprot_external_evidence
  ckpt_cfg:
    start_step: 2500
    end_step: 2500
    eval_every_n_ckpts: 1
    eval_last_ckpt: false
    use_ema: true
  atom_mpnn:
    sampling_cfg: /home/users/zhkim216/code/elix/allatom_design/configs/seq_des/lc_atom_mpnn_inference.yaml
    overrides:
      batch_size: 1
      num_seqs_per_pdb: 2
      use_potts_sampling: true
      potts_sampling_cfg:
        potts_sweeps: 50
        lcp_expand_edge_idx_fix: true
        rejection_step: false

guidance_cfg:
  enabled: false

sampling_inputs_csv: /scratch/users/zhkim216/datasets/val_cifs/nativeval_cifs/sampling_inputs_metal_nativeval_sm_all.csv
pos_constraint_csv: null

redesign_cfg:
  use_native_seq: false
  native_cif_dir: null

pocket_cfg:
  n_min_ligand_atoms_for_seq_recovery: 1

input_sample_is_all_atom: true
input_sample_is_designed: false
load_from_cache: false

pdb_cfg:
  pdb_dir: /scratch/users/zhkim216/datasets/val_cifs/nativeval_cifs/cifs
  pdb_name_list: /scratch/users/zhkim216/datasets/val_cifs/nativeval_cifs/metal_nativeval_sm_all.txt
  pdb_name_ext: ".cif"
  recursive: false
  split_by_subfolder: false
  sample_indices: null
  sample_lengths: null
  array_id: null
  num_arrays: null

featurizer_cfg:
  design:
    residue_cache_dir: /scratch/users/zhkim216/datasets/atomworks_cached_residue_data

struct_pred_cfg:
  evaluate_self_consistency: true
  evaluate_docking_consistency: false
  calculate_metrics_only: false
  af3:
    runner_path: /home/users/zhkim216/code/elix/alphafold3/src/alphafold3/run_alphafold.py
    inference_config:
      ss:
        num_recycles: 10
        num_diffusion_samples: 5

hydra:
  run:
    dir: /scratch/users/zhkim216/hydra_outputs/eval_proto_metal_nativeval_sm_all_debug
